<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header>
        <h1>Sign Up Page</h1>
    </header>
    <main>
        <div id="message"></div>
        <form action="formprocessing.html" method="post" id="myform">
            <fieldset>
                <legend>Account</legend>
                <div class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email">
                </div>
                
                <div class="form-row">
                    <label for="password">Password:</label>
                    <input type="password" name="pass" id="password">
                </div>

            </fieldset>

            <fieldset>
                <legend>About You</legend>

                <div class="form-row">
                    <label for="bdate">Birthday:</label>
                    <input type="date" name="bdate" id="bdate">
                </div>
                
                <div class="form-row">
                    <label for="state">State:</label>
                    <select name="state" id="state">
                        <option id="blank" value="blank">---------</option>
                        <option value="CA">California</option>
                        <option value="HI">Hawaii</option>
                        <option value="UT">Utah</option>
                    </select>
                </div>

                <div class="check-row">
                    <div class="spacer"> </div>
                    <label><input type="checkbox" name="Yougood">You is good?</label>
                </div>

                <fieldset>
                    <legend>Choose your gender</legend>
                    <div class="check-row" id="radio">
                        <label><input type="radio" name="gender" value="Male">Male</label>
                        <label><input type="radio" name="gender" value="Female">Female</label>
                    </div>
                </fieldset>

                <div class="check-row comment-row">
                    <label for="comment">Comment: </label>
                    <textarea name="comment" id="comment"></textarea>
                </div>
            </fieldset>

            <div class="check-row">
                <input type="submit" value="Sign Up">
            </div>
        </form>

    </main>
    <footer>
        <p>&copy; 2026 The Author</p>
    </footer>

    <script src="form.js"> </script>
</body>
</html>
