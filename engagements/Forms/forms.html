<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <header><h1>Mars' Site</h1></header>
    <main>
        <form action="fromprocessing.html" method="post">
            <fieldset>
                <legend>Accont Information</legend>
                <div class="form-row">
                    <label for="personname">Full Name </label>
                    <input id="personname" type="text" name="fullname" placeholder="Full Name">
                </div>

                <div class="form-row">
                    <label for="email">Email </label>
                    <input type="email" name="email" placeholder="Email" id="email">
                </div>

                <div class="form-row">
                    <label for="Birthday">Birthdahy</label>
                    <input type="date" name="Birthday" placeholder="Email" id="email">
                </div>

                <div class="form-row">
                    <label for="password">Password </label>
                    <input type="password" name="pass" id="bdate">
                </div>

                <div class="form-row">
                    <label for="state">State</label>
                    <select name="state" id="state">
                        <option value="blank">--------------</option>
                        <option value="MEL">Melbourne</option>
                        <option value="QLD">Queensland</option>
                        <option value="NT">Northern Territory</option>
                    </select>
                </div>

                <div class="form-row">
                    <label><input type="checkbox" name="I good"> I am good.</label>
                </div>
            
                <div class="form-row">
                    <label><input type="radio" name="gender" value="Male">Male</label>
                    <label><input type="radio" name="gender" value="Female">Female</label>
                </div>

                <div class="form-row">
                    <label for="comments">Comments</label>
                    <textarea name="comments" id="comment"></textarea>
                </div>

                <div class="form-row">
                    <input type="submit" value="Sign Up">
                </div>
            </fieldset>
        </form>
