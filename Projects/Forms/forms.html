<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Forms</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <header>
        <h1>Movie Parlour</h1>
    </header>
    <main>
        <h2>SIGN UP</h2>
        <form action="contactus.html">
            <fieldset>
                <legend>Account</legend>

                <div class="topsect">
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email">
                </div>

                <div class="topsect">
                    <label for="password">Password: </label>
                    <input type="password" name="password" id="password">
                </div>
            </fieldset>

            <fieldset>
                <legend>About You</legend>

                <div class="yousect">
                    <label for="name">Name: </label>
                    <input type="text" name="name" id="name">
                </div>

                <div class="yousect">
                    <label for="bd">Birthdate: </label>
                    <input type="date" name="bd" id="bd">
                </div>

                <div class="yousect"> 
                    <label for="gender">What is your gender? </label>
                    <label><input type="radio" name="gender" value="Male" id="gender">Male</label>
                    <label><input type="radio" name="gender" value="Female" id="gender">Female</label>
                </div>

                <div class="yousect">
                    <label for="checkbox">Favourite Movie Genre (Select up to 3 boxes): </label>
                    <div class="check">
                        <label><input type="checkbox">Action</label>
                        <label><input type="checkbox">Adventure</label>
                        <label><input type="checkbox">Comedy</label>
                        <label><input type="checkbox">Drama</label>
                        <label><input type="checkbox">Fantasy</label>
                        <label><input type="checkbox">Horror</label>
                        <label><input type="checkbox">Sci-fi</label>
                        <label><input type="checkbox">Romance</label>
                        <label><input type="checkbox">Thriller</label>
                        <label><input type="checkbox">Mystery</label>
                        <label><input type="checkbox">Animation</label>
                        <label><input type="checkbox">Documentary</label>
                    </div>
                </div>

                <div class="yousect">
                    <label for="time">What nights can you attend?</label>
                    <select name="time" id="time">
                        <option value="blank">---------</option>
                        <option value="FRI">Friday 7pm-11pm</option>
                        <option value="SAT">Saturday 7pm-11pm</option>
                        <option value="WEND">Friday &amp; Saturday 7pm-11pm</option>
                        <option value="WED">Wednesday 7pm-9pm</option>
                    </select>
                </div>

                <div class="yousect">
                    <label for="sugg">Any movie suggestions?</label>
                    <textarea name="sugg" id="sugg"></textarea>
                </div>
            </fieldset>

            <div class="yousect">
                <input type="submit" value="Sign Up" id="submit">
            </div>
        </form>
    </main>
    <footer>
        &copy; 2026 Author
    </footer>
</body>
</html>
